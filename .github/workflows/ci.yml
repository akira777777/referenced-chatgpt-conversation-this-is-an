name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 is the project's stated minimum (see package.json engines).
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

  build-and-e2e:
    name: Production build & E2E (incl. enforced CSP browser check)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (vinext)
        run: npm run build
        env:
          # Provide harmless defaults so the build doesn't try to read real
          # Supabase / Telegram secrets at compile time. The app falls back
          # to in-memory mode for both.
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          ADMIN_SECRET: placeholder-admin-secret

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E tests (server-rendered HTML, CSP report sink, nonce CSP in browser)
        run: npm run test:e2e
